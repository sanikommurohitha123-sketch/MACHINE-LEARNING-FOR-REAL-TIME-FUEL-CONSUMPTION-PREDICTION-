{% extends 'User/userbase.html' %}

{% block contents %}

<section class="container py-5">
  <div class="row">
    <div class="col-12">
      <h1 class="text-center mb-4">Predict Fuel Consumption</h1>
      <form method="post" class="mb-5">
        {% csrf_token %}
        
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="year" class="form-label">Year:</label>
            <input type="number" id="year" name="year" class="form-control" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="make" class="form-label">Make:</label>
            <select id="make" name="make" class="form-control" required>
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="model" class="form-label">Model:</label>
            <select id="model" name="model" class="form-control" required>
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label for="vehicle_class" class="form-label">Vehicle Class:</label>
            <select id="vehicle_class" name="vehicle_class" class="form-control" required>
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="engine_size" class="form-label">Engine Size (L):</label>
            <input type="number" step="0.01" id="engine_size" name="engine_size" class="form-control" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="cylinders" class="form-label">Cylinders:</label>
            <input type="number" id="cylinders" name="cylinders" class="form-control" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="transmission" class="form-label">Transmission:</label>
            <select id="transmission" name="transmission" class="form-control" required>
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label for="fuel_type" class="form-label">Fuel Type:</label>
            <select id="fuel_type" name="fuel_type" class="form-control" required>
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="hwy" class="form-label">Hwy (L/100 km):</label>
            <input type="number" step="0.01" id="hwy" name="hwy" class="form-control" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="comb" class="form-label">Comb (L/100 km):</label>
            <input type="number" step="0.01" id="comb" name="comb" class="form-control" required>
          </div>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary">Predict</button>
        </div>
      </form>

      {% if predicted_value %}
      <h2 class="text-center text-success">Predicted Fuel Consumption: {{ predicted_value }} L/100Km</h2>
      {% endif %}

      {% if error %}
      <h2 class="text-center text-danger">Error: {{ error }}</h2>
      {% endif %}

    </div>
  </div>
</section>
